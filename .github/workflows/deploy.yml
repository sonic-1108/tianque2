name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      # 联机: our own relay (Cloudflare Worker, relay/), the same pipeline as 天阙 1's. Skipped until the repo has the
      # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets (the game then uses 天阙 1's relay); a failure never
      # blocks the site.
      - name: Deploy relay
        id: relay
        if: ${{ env.CF_TOKEN != '' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain
          sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" $api | jq -r '.result.subdomain // empty')
          [ -z "$sub" ] && sub=msjzxy2022
          cd relay
          if npx --yes wrangler@4 deploy > ../wrangler.log 2>&1; then
            echo "url=wss://tianque2-relay.$sub.workers.dev" >> $GITHUB_OUTPUT
            echo "::notice::relay deployed: wss://tianque2-relay.$sub.workers.dev"
          else
            echo "::warning::relay deploy failed: $(grep -m3 -i 'error' ../wrangler.log | tr '\n' ' ' | cut -c1-300)"
          fi
      - run: npx vite build
        env:
          VITE_T2_RELAY: ${{ steps.relay.outputs.url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
