# 天阙 · 散人行 relay: 联机 rooms (one Durable Object per room code: the host's messages to every guest, a guest's to
# the host) and the hub (one object with its SQLite: accounts, sessions, cloud saves, friends, the world socket).
# Deployed from sonic-1108/tianque-assets by its `t2 relay` workflow (run by hand), where the Cloudflare secrets are.
name = "tianque2-relay"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Hub"]
