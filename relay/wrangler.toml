# 天阙 · 散人行 relay (联机): one Durable Object per room code; whatever the host sends goes to every guest, whatever a
# guest sends goes to the host. Deployed by .github/workflows/deploy.yml when the repo has the Cloudflare secrets
# (the same pipeline as 天阙 1's); without them the game uses 天阙 1's relay, which speaks the same.
name = "tianque2-relay"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
